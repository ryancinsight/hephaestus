[package]
name = "hephaestus-metal"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Retired by ADR 0047: a forwarding layer over hephaestus-wgpu with the Metal adapter selected. Use hephaestus-wgpu directly."
readme = "README.md"
keywords = ["gpu", "metal", "macos", "wgpu", "compute"]
categories.workspace = true

[features]
default = ["parallel", "mnemosyne-memory", "decomposition"]
parallel = []
mnemosyne-memory = []
metal = []
## Enable dense matrix decompositions (Cholesky, LU, QR) backed by leto-ops.
decomposition = []

[dependencies]
hephaestus-core = { workspace = true }
hephaestus-wgpu = { workspace = true }
leto = { workspace = true }
eunomia = { workspace = true }
leto-ops = { workspace = true }
bytemuck = { workspace = true }
themis = { workspace = true }

[dev-dependencies]
hephaestus-conformance = { workspace = true }
leto-ops = { workspace = true }
aequitas = { workspace = true }

[lints]
workspace = true
