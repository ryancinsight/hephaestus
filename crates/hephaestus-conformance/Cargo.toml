[package]
name = "hephaestus-conformance"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend-neutral conformance suite for the Atlas accelerator seams: one set of contract clauses every ComputeDevice implementation is held to."
readme = "README.md"
keywords = ["gpu", "conformance", "testing", "compute"]
categories.workspace = true
# Ordering guard, not an oversight (ADR 0037 §4): a crate can publish only once
# its first-party dependencies are on crates.io, and hephaestus-core is not yet
# published. The flag is removed as the last step of that publish.
publish = false

[dependencies]
hephaestus-core = { workspace = true }
bytemuck = { workspace = true }
aequitas = { workspace = true }
eunomia = { workspace = true }
leto = { workspace = true, default-features = false, features = ["std"] }
leto-ops = { workspace = true }
