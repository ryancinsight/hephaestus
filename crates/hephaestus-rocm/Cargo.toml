[package]
name = "hephaestus-rocm"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ROCm/HIP backend for the Atlas accelerator substrate: typed device buffers and runtime-compiled operator kernels."
readme = "README.md"
keywords = ["gpu", "rocm", "hip", "amd", "compute"]
categories.workspace = true

[features]
default = []
rocm = ["dep:cubecl-hip-sys"]
decomposition = []

[dependencies]
hephaestus-core = { workspace = true }
bytemuck = { workspace = true }
smallvec = { workspace = true }
themis = { workspace = true }
leto = { workspace = true }
eunomia = { workspace = true }
leto-ops = { workspace = true }
cubecl-hip-sys = { workspace = true, optional = true }

[dev-dependencies]
hephaestus-conformance = { workspace = true }
aequitas = { workspace = true }

[lints]
workspace = true
