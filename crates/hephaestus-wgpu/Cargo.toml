[package]
name = "hephaestus-wgpu"
autotests = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "wgpu backend for the Atlas accelerator substrate: device acquisition, typed buffers, and monomorphized compute dispatch."
readme = "README.md"
keywords = ["gpu", "wgpu", "compute", "wgsl", "vulkan"]
categories.workspace = true

[features]
default = ["parallel", "mnemosyne-memory", "decomposition", "sparse"]
parallel = []
mnemosyne-memory = []
## Enable dense matrix decompositions (Cholesky, LU, QR) backed by leto-ops.
decomposition = ["dep:leto-ops"]
## Enable CSR sparse matrix upload/download and GPU sparse products.
sparse = ["dep:leto-ops"]

[dependencies]
hephaestus-core = { workspace = true }
leto = { workspace = true }
eunomia = { workspace = true }
leto-ops = { workspace = true, optional = true }
themis = { workspace = true }
mnemosyne-memory-core = { workspace = true }
moirai-gpu = { workspace = true }
moirai-sync = { workspace = true }
moirai = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
smallvec = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Resolution constraint for WGPU HAL's gpu-allocator D3D12 type identity.
windows = { workspace = true }

[dev-dependencies]
hephaestus-conformance = { workspace = true }
criterion = { workspace = true }
pollster = { workspace = true }
leto-ops = { workspace = true }
loom = { workspace = true }
aequitas = { workspace = true }
syn = { workspace = true }

[[bench]]
name = "elementwise_into"
harness = false

[[bench]]
name = "reduction_width"
harness = false

[[bench]]
name = "comparative"
harness = false

[[bench]]
name = "sparse_comparative"
harness = false

[[bench]]
name = "decomposition_sync"
harness = false

[[bench]]
name = "blocked_qr_tail"
harness = false

[[bench]]
name = "scan_throughput"
harness = false

[[bench]]
name = "prepared_map_reduction"
harness = false

[[bench]]
name = "fft_prepared"
harness = false

[[test]]
name = "contracts"
path = "tests/contracts.rs"

[lints]
workspace = true
