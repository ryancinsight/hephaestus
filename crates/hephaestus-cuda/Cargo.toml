[package]
name = "hephaestus-cuda"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CUDA backend for the Atlas accelerator substrate: dynamic-loaded driver device acquisition, typed device buffers, and host/device transfer."
readme = "README.md"
keywords = ["gpu", "cuda", "nvidia", "compute", "kernel"]
categories.workspace = true

[features]
# Default includes the CUDA toolchain so the crate builds and runs with CUDA
# support enabled by default. The driver is still loaded dynamically at runtime,
# so deployment does not require static CUDA linkage.
default = ["parallel", "mnemosyne-memory", "decomposition", "cuda"]
parallel = []
mnemosyne-memory = []
cuda = ["dep:cuda-oxide", "dep:libloading"]
## Enable dense matrix decompositions (Cholesky, LU, QR) backed by leto-ops.
## The decomposition modules launch CUDA kernels and therefore require the
## CUDA device substrate as part of the same feature contract.
decomposition = ["cuda"]

[dependencies]
hephaestus-core = { workspace = true }
leto = { workspace = true }
eunomia = { workspace = true }
leto-ops = { workspace = true }
bytemuck = { workspace = true }
smallvec = { workspace = true }
themis = { workspace = true }
mnemosyne-memory-core = { workspace = true }
moirai-gpu = { workspace = true }
moirai-sync = { workspace = true }
libloading = { version = "0.8", optional = true }
# cuda-oxide owns the device substrate per ADR 0001.
cuda-oxide = { version = "0.4.0", optional = true }

[dev-dependencies]
hephaestus-conformance = { workspace = true }
aequitas = { workspace = true }

[[bench]]
name = "comparative"
harness = false
required-features = ["decomposition"]

[[example]]
name = "cuda_init"
required-features = ["cuda"]

[[example]]
name = "cuda_raw"
required-features = ["cuda"]

[lints]
workspace = true
