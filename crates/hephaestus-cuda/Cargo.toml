[package]
name = "hephaestus-cuda"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CUDA backend for the Atlas accelerator substrate: dynamic-loaded driver device acquisition, typed device buffers, and host/device transfer."
readme = "README.md"
keywords = ["gpu", "cuda", "nvidia", "compute", "kernel"]
categories.workspace = true

[features]
# CUDA support loads the system driver and runtime compiler on demand.
# Building this backend needs neither toolkit headers nor a CUDA import library.
default = ["parallel", "mnemosyne-memory", "decomposition", "cuda"]
parallel = []
mnemosyne-memory = []
cuda = ["dep:libloading"]
## Enable dense matrix decompositions (Cholesky, LU, QR) backed by leto-ops.
## The decomposition modules launch CUDA kernels and therefore require the
## CUDA device substrate as part of the same feature contract.
decomposition = ["cuda"]

[dependencies]
hephaestus-core = { workspace = true }
leto = { workspace = true }
eunomia = { workspace = true }
leto-ops = { workspace = true }
smallvec = { workspace = true }
themis = { workspace = true }
moirai-sync = { workspace = true }
tracing = { workspace = true }
libloading = { version = "0.8", optional = true }

[dev-dependencies]
hephaestus-conformance = { workspace = true }
hephaestus-core = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
aequitas = { workspace = true }

[[bench]]
name = "comparative"
harness = false
required-features = ["decomposition"]

[[example]]
name = "cuda_init"
required-features = ["cuda"]

[lints]
workspace = true
