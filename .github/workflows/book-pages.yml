name: Deploy mdBook

on:
  push:
    branches: [master]
    paths:
      - "docs/book/**"
      - ".github/workflows/book-pages.yml"
  pull_request:
    paths:
      - "docs/book/**"
      - ".github/workflows/book-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@1fcd17c6f7923cb1734756c15e0a5a39e333ee32
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      output-path: target/book/hephaestus
      mdbook-test: true
      rust-toolchain: "1.97.0"
      cargo-package: hephaestus-host
      cargo-crate: hephaestus_host
