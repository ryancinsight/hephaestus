name: Metal Backend

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0

jobs:
  metal:
    name: macOS Metal contracts
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out Hephaestus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hephaestus
          persist-credentials: false

      # Hephaestus uses sibling path dependencies in the supported Atlas
      # checkout topology. Keep the topology intact instead of rewriting
      # manifests for one hosted runner.
      - name: Check out Leto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/leto
          path: leto
          persist-credentials: false

      - name: Check out Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hermes
          ref: v0.4.1
          path: hermes
          persist-credentials: false

      - name: Check out Eunomia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/eunomia
          path: eunomia
          persist-credentials: false

      - name: Check out Mnemosyne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
          persist-credentials: false

      - name: Check out Moirai
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Moirai
          path: moirai
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install nextest
        shell: bash
        run: cargo install cargo-nextest --locked

      - name: Configure the checkout-local Cargo graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.cargo"
          sed "s|/workspace|$GITHUB_WORKSPACE|g" \
            "$GITHUB_WORKSPACE/hephaestus/.github/rocm-cargo-config.toml" \
            > "$GITHUB_WORKSPACE/.cargo/config.toml"
          cargo "+$RUST_TOOLCHAIN" update --workspace

      - name: Check Metal feature surfaces
        working-directory: hephaestus
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" fmt --check
          cargo "+$RUST_TOOLCHAIN" check --package hephaestus-metal \
            --no-default-features --all-targets
          cargo "+$RUST_TOOLCHAIN" check --package hephaestus-metal \
            --all-targets

      - name: Run Metal warning-denied contracts and docs
        working-directory: hephaestus
        env:
          HEPHAESTUS_METAL_REQUIRE_DEVICE: "1"
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" clippy --package hephaestus-metal \
            --all-targets --no-deps --locked -- -D warnings
          cargo "+$RUST_TOOLCHAIN" nextest run --package hephaestus-metal --locked
          cargo "+$RUST_TOOLCHAIN" test --package hephaestus-metal --doc --locked
          cargo "+$RUST_TOOLCHAIN" doc --package hephaestus-metal --no-deps --locked
