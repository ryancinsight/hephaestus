name: ROCm Backend

on:
  push:
    branches: [master]
    paths: ["crates/hephaestus-rocm/**", "crates/hephaestus-core/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rocm.yml"]
  pull_request:
    paths: ["crates/hephaestus-rocm/**", "crates/hephaestus-core/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rocm.yml"]
  workflow_dispatch:
    inputs:
      run_hardware:
        description: Run the AMD hardware contract lane on a registered self-hosted runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: rocm-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: 1.95.0
  ROCM_IMAGE: rocm/dev-ubuntu-24.04:7.2.4

# Cargo.lock owns provider identity in every backend lane. Do not replace its
# Git sources with sibling paths or rewrite the dependency graph during a gate.
jobs:
  rocm-container:
    name: ROCm feature and adapterless contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Hephaestus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hephaestus
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the locked API verifier
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/atlas
          ref: 7a5a1036973b81dee0e20321942ce0c7e2bf9f9b
          path: atlas
          persist-credentials: false

      - name: Install the API comparison tool
        if: github.event_name == 'pull_request'
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-semver-checks@0.49.0
          checksum: true

      - name: Build and test in the AMD ROCm development image
        env:
          API_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          API_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull "${ROCM_IMAGE}"; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "failed to pull ${ROCM_IMAGE} after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          api_mount=()
          if [[ -n "$API_BASE" ]]; then
            api_mount=(--volume "$(command -v cargo-semver-checks):/usr/local/bin/cargo-semver-checks:ro")
          fi
          docker run --rm --network host \
            "${api_mount[@]}" \
            --env API_BASE --env API_HEAD \
            --env "RUST_TOOLCHAIN=${RUST_TOOLCHAIN}" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/hephaestus \
            "${ROCM_IMAGE}" \
            bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends ca-certificates curl git build-essential pkg-config python3 rocm-hip-runtime-dev
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              . "$HOME/.cargo/env"
              rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
              rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
              rustup toolchain install stable --profile minimal
              cargo +stable install cargo-nextest --locked
              cargo "+$RUST_TOOLCHAIN" fmt --check
              cargo "+$RUST_TOOLCHAIN" check --package hephaestus-rocm --no-default-features --all-targets --locked
              cargo "+$RUST_TOOLCHAIN" check --package hephaestus-rocm --no-default-features --features decomposition --all-targets --locked
              cargo "+$RUST_TOOLCHAIN" check --package hephaestus-rocm --features rocm --all-targets --locked
              cargo "+$RUST_TOOLCHAIN" check --package hephaestus-rocm --features rocm,decomposition --all-targets --locked
              cargo "+$RUST_TOOLCHAIN" clippy --package hephaestus-rocm --features rocm,decomposition --all-targets --no-deps --locked -- -D warnings
              cargo "+$RUST_TOOLCHAIN" nextest run --package hephaestus-rocm --features rocm,decomposition --locked
              cargo "+$RUST_TOOLCHAIN" test --package hephaestus-rocm --features rocm,decomposition --doc --locked
              cargo "+$RUST_TOOLCHAIN" doc --package hephaestus-rocm --features rocm,decomposition --no-deps --locked
              if [ -n "$API_BASE" ]; then
                rustup toolchain install 1.97.0 --profile minimal
                git config --global --add safe.directory /workspace/hephaestus
                python3 /workspace/atlas/scripts/atlas_semver_locked.py \
                  --repo /workspace/hephaestus --base "$API_BASE" --head "$API_HEAD" \
                  --package hephaestus-rocm --toolchain 1.97.0 \
                  --report /workspace/semver-rocm.json
                cat /workspace/semver-rocm.json
              fi
            '

  rocm-hardware:
    name: AMD hardware contracts
    if: github.event_name == 'workflow_dispatch' && inputs.run_hardware
    runs-on: [self-hosted, linux, x64, rocm]
    timeout-minutes: 30
    steps:
      - name: Check out Hephaestus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hephaestus
          persist-credentials: false

      - name: Inspect the AMD runtime
        shell: bash
        run: |
          set -euo pipefail
          hipconfig --version
          rocminfo

      - name: Install the pinned Rust toolchain and nextest
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install nextest
        shell: bash
        run: cargo install cargo-nextest --locked

      - name: Run required-device contracts
        working-directory: hephaestus
        env:
          HEPHAESTUS_ROCM_REQUIRE_DEVICE: "1"
        run: cargo nextest run --package hephaestus-rocm --features rocm,decomposition --locked
