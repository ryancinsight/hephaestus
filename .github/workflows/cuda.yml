name: CUDA Backend

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_hardware:
        description: Run the CUDA contract lane on a registered self-hosted runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cuda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0
  CUDA_IMAGE: nvidia/cuda:13.2.1-devel-ubuntu24.04

jobs:
  cuda-container:
    name: CUDA feature and adapterless contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Hephaestus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hephaestus
          persist-credentials: false

      # Keep the checkout graph identical to the supported Atlas topology.
      - name: Check out Leto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/leto
          path: leto
          persist-credentials: false

      - name: Check out Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hermes
          ref: v0.4.1
          path: hermes
          persist-credentials: false

      - name: Check out Eunomia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/eunomia
          path: eunomia
          persist-credentials: false

      - name: Check out Mnemosyne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
          persist-credentials: false

      - name: Check out Moirai
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Moirai
          path: moirai
          persist-credentials: false

      - name: Build and test in the NVIDIA CUDA development image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$CUDA_IMAGE"
          docker run --rm --network host \
            --env "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" \
            --env CUDA_TOOLKIT_PATH=/usr/local/cuda \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/hephaestus \
            "$CUDA_IMAGE" \
            bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends ca-certificates curl git build-essential pkg-config libclang-dev
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              . "$HOME/.cargo/env"
              rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
              rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
              rustup toolchain install stable --profile minimal
              cargo +stable install cargo-nextest --locked
              if [ -f /usr/local/cuda/lib64/stubs/libcuda.so ] && [ ! -e /usr/local/cuda/lib64/stubs/libcuda.so.1 ]; then
                ln -s libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
              fi
              export LD_LIBRARY_PATH=/usr/local/cuda/lib64/stubs:/usr/local/cuda/compat:/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}
              mkdir -p /workspace/.cargo
              cp /workspace/hephaestus/.github/rocm-cargo-config.toml \
                /workspace/.cargo/config.toml
              cargo "+$RUST_TOOLCHAIN" update --manifest-path /workspace/hephaestus/Cargo.toml --workspace
              cargo "+$RUST_TOOLCHAIN" fmt --check
              cargo "+$RUST_TOOLCHAIN" check --package hephaestus-cuda \
                --no-default-features --all-targets
              cargo "+$RUST_TOOLCHAIN" check --package hephaestus-cuda \
                --features cuda,decomposition --all-targets
              cargo "+$RUST_TOOLCHAIN" clippy --package hephaestus-cuda \
                --features cuda,decomposition --all-targets --no-deps --locked -- -D warnings
              cargo "+$RUST_TOOLCHAIN" nextest run --package hephaestus-cuda \
                --features cuda,decomposition --locked
              cargo "+$RUST_TOOLCHAIN" test --package hephaestus-cuda \
                --features cuda,decomposition --doc --locked
              cargo "+$RUST_TOOLCHAIN" doc --package hephaestus-cuda \
                --features cuda,decomposition --no-deps --locked
            '

  cuda-hardware:
    name: NVIDIA hardware contracts
    if: github.event_name == 'workflow_dispatch' && inputs.run_hardware
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 30
    steps:
      - name: Check out Hephaestus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hephaestus
          persist-credentials: false

      - name: Check out Leto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/leto
          path: leto
          persist-credentials: false

      - name: Check out Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hermes
          ref: v0.4.1
          path: hermes
          persist-credentials: false

      - name: Check out Eunomia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/eunomia
          path: eunomia
          persist-credentials: false

      - name: Check out Mnemosyne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
          persist-credentials: false

      - name: Check out Moirai
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Moirai
          path: moirai
          persist-credentials: false

      - name: Inspect the NVIDIA runtime
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi

      - name: Install the pinned Rust toolchain and nextest
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install nextest
        shell: bash
        run: cargo install cargo-nextest --locked

      - name: Configure the checkout-local Cargo graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.cargo"
          sed "s|/workspace|$GITHUB_WORKSPACE|g" \
            "$GITHUB_WORKSPACE/hephaestus/.github/rocm-cargo-config.toml" \
            > "$GITHUB_WORKSPACE/.cargo/config.toml"
          cargo "+$RUST_TOOLCHAIN" update --manifest-path "$GITHUB_WORKSPACE/hephaestus/Cargo.toml" --workspace

      - name: Run required-device CUDA contracts
        working-directory: hephaestus
        env:
          HEPHAESTUS_CUDA_REQUIRE_DEVICE: "1"
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" nextest run --package hephaestus-cuda \
            --features cuda,decomposition --locked
