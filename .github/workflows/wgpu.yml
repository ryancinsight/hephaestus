name: WGPU Backend

on:
  push:
    branches: [master]
    paths: ["crates/hephaestus-wgpu/**", "crates/hephaestus-core/**", "Cargo.toml", "Cargo.lock", ".github/workflows/wgpu.yml"]
  pull_request:
    paths: ["crates/hephaestus-wgpu/**", "crates/hephaestus-core/**", "Cargo.toml", "Cargo.lock", ".github/workflows/wgpu.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wgpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0

jobs:
  wgpu:
    name: WGPU feature and software-adapter contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Hephaestus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hephaestus
          persist-credentials: false

      # Keep the checkout graph identical to the supported Atlas topology.
      - name: Check out Leto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/leto
          path: leto
          persist-credentials: false

      - name: Check out Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hermes
          ref: v0.4.1
          path: hermes
          persist-credentials: false

      - name: Check out Eunomia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/eunomia
          path: eunomia
          persist-credentials: false

      - name: Check out Mnemosyne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
          persist-credentials: false

      - name: Check out Moirai
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Moirai
          path: moirai
          persist-credentials: false

      - name: Install Vulkan software support
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - name: Install the pinned Rust toolchain and nextest
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install nextest
        shell: bash
        run: cargo install cargo-nextest --locked

      - name: Configure the checkout-local Cargo graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.cargo"
          sed "s|/workspace|$GITHUB_WORKSPACE|g" \
            "$GITHUB_WORKSPACE/hephaestus/.github/rocm-cargo-config.toml" \
            > "$GITHUB_WORKSPACE/.cargo/config.toml"
          cargo "+$RUST_TOOLCHAIN" update --manifest-path "$GITHUB_WORKSPACE/hephaestus/Cargo.toml" --workspace

      - name: Check WGPU feature surfaces
        working-directory: hephaestus
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" fmt --check
          cargo "+$RUST_TOOLCHAIN" check --package hephaestus-wgpu \
            --no-default-features --lib
          cargo "+$RUST_TOOLCHAIN" check --package hephaestus-wgpu \
            --all-targets

      - name: Run WGPU warning-denied contracts and docs
        working-directory: hephaestus
        env:
          HEPHAESTUS_WGPU_REQUIRE_DEVICE: "1"
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" clippy --package hephaestus-wgpu \
            --all-targets --no-deps --locked -- -D warnings
          cargo "+$RUST_TOOLCHAIN" nextest run --package hephaestus-wgpu --locked
          cargo "+$RUST_TOOLCHAIN" test --package hephaestus-wgpu --doc --locked
          cargo "+$RUST_TOOLCHAIN" doc --package hephaestus-wgpu --no-deps --locked
