name: WGPU Backend

on:
  push:
    branches: [master]
    paths: ["crates/hephaestus-wgpu/**", "crates/hephaestus-core/**", "crates/hephaestus-conformance/**", "Cargo.toml", "Cargo.lock", ".github/workflows/wgpu.yml", ".github/scripts/intrinsic_qualification_identity.py"]
  pull_request:
    paths: ["crates/hephaestus-wgpu/**", "crates/hephaestus-core/**", "crates/hephaestus-conformance/**", "Cargo.toml", "Cargo.lock", ".github/workflows/wgpu.yml", ".github/scripts/intrinsic_qualification_identity.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: wgpu-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: 1.95.0

# Cargo.lock owns provider identity in every backend lane. Do not replace its
# Git sources with sibling paths or rewrite the dependency graph during a gate.
jobs:
  wgpu:
    name: WGPU feature and software-adapter contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Hephaestus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hephaestus
          persist-credentials: false

      - name: Install Vulkan software support
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - name: Install the pinned Rust toolchain and nextest
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install nextest
        shell: bash
        run: cargo install cargo-nextest --locked

      - name: Check WGPU feature surfaces
        working-directory: hephaestus
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" fmt --check
          cargo "+$RUST_TOOLCHAIN" check --package hephaestus-wgpu \
            --no-default-features --lib --locked
          cargo "+$RUST_TOOLCHAIN" check --package hephaestus-wgpu \
            --all-targets --locked

      - name: Run WGPU warning-denied contracts and docs
        working-directory: hephaestus
        env:
          HEPHAESTUS_WGPU_REQUIRE_DEVICE: "1"
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" clippy --package hephaestus-wgpu \
            --all-targets --no-deps --locked -- -D warnings
          cargo "+$RUST_TOOLCHAIN" nextest run --package hephaestus-wgpu --locked
          cargo "+$RUST_TOOLCHAIN" test --package hephaestus-wgpu --doc --locked
          cargo "+$RUST_TOOLCHAIN" doc --package hephaestus-wgpu --no-deps --locked
          timeout 60s cargo "+$RUST_TOOLCHAIN" test --package hephaestus-wgpu \
            --bench fft_prepared --locked -- --test

      - name: Retain exact intrinsic witness qualification diagnostics
        working-directory: hephaestus
        env:
          HEPHAESTUS_WGPU_REQUIRE_DEVICE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/intrinsic_qualification_identity.py
          # Additional focused evidence; the full mandatory suites above stay unchanged.
          # Nextest retains the existing 60-second termination bound.
          cargo "+$RUST_TOOLCHAIN" nextest run --package hephaestus-wgpu \
            --test contracts --locked --success-output immediate \
            --test-threads 1 -- --exact intrinsic_qualification::exact_intrinsic_witness_qualification
