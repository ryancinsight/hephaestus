[workspace]
resolver = "3"
members = [
    "crates/hephaestus",
    "crates/hephaestus-conformance", "crates/hephaestus-host",
    "crates/hephaestus-core",
    "crates/hephaestus-wgpu",
    "crates/hephaestus-cuda",
    "crates/hephaestus-rocm",
    "crates/hephaestus-metal",
    "crates/hephaestus-python",
]

[workspace.package]
version = "0.19.0"
edition = "2024"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/hephaestus.git"
# Shared registry classification. `readme` is deliberately NOT inherited: an
# inherited `readme` path resolves against the workspace root, which would point
# every member at the root README instead of its own landing page.
categories = ["science", "hardware-support"]

[workspace.dependencies]
# ── Local Workspace Crates ──
hephaestus-conformance = { path = "crates/hephaestus-conformance" }
hephaestus-core = { version = "0.19.0", path = "crates/hephaestus-core" }
hephaestus-wgpu = { version = "0.19.0", path = "crates/hephaestus-wgpu" }
hephaestus-cuda = { version = "0.19.0", path = "crates/hephaestus-cuda", default-features = false }
hephaestus-rocm = { version = "0.19.0", path = "crates/hephaestus-rocm", default-features = false }
hephaestus-metal = { version = "0.19.0", path = "crates/hephaestus-metal" }

# ── GPU ──
# Hephaestus owns the Atlas WGPU ABI; consumers pin this exact major.
# `default-features = false` drops WGPU's D3D12 backend: it is unused for Atlas
# GPU compute (vulkan on Windows/Linux, metal on macOS) and its wgpu-hal 30
# suballocation path pulls gpu-allocator↔windows D3D12 type edges that do not
# unify across consumers' independent dependency resolutions (see the
# `windows = "=0.62.2"` pin below). Explicit compute backends replace the
# default set minus D3D12. `std` is required: without it wgpu's error-scope
# thread ID degenerates to a single key shared by every thread, so concurrent
# scopes on one device interleave and pop in the wrong order (reverse-order
# mismatch panic in `pop_error_scope`).
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "vulkan", "metal"] }
pollster = "0.3"
criterion = "0.8.2"
cubecl-hip-sys = "7.2.5321100"

# gpu-allocator 0.28 accepts Windows bindings 0.53..=0.62 while WGPU HAL 30
# exchanges its D3D12 types with Windows 0.62. Pin the shared edge so Cargo
# cannot reuse Moirai PAL's independent Windows 0.58 binding for the allocator.
windows = "=0.62.2"

# ── Foundations ──
bytemuck = { version = "1.19", features = ["derive"] }
smallvec = "1.15.2"
thiserror = "2.0"
syn = { version = "2.0.119", features = ["full", "visit"] }
aequitas = { version = "0.2.0", git = "https://github.com/ryancinsight/aequitas", default-features = false }
eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }
# leto host-side layout metadata (shape/strides/offset + broadcast) reused as
# the backend-agnostic indexing vocabulary per atlas ADR 0001. Layout/array
# types only — no CPU compute dependency (leto-ops is not pulled).
leto = { version = "0.42.0", git = "https://github.com/ryancinsight/leto.git", default-features = false, features = ["std", "parallel", "mnemosyne-memory"] }
# themis placement/topology law (atlas ADR 0002): hephaestus is the provider
# that reports device properties into themis GpuTopology snapshots. The package
# published as themis-topology; the extern crate name remains themis.
themis = { package = "themis-topology", version = "0.10.1", git = "https://github.com/ryancinsight/themis", default-features = false, features = ["std"] }
leto-ops = { version = "0.42.0", git = "https://github.com/ryancinsight/leto.git", features = ["std", "parallel", "mnemosyne-memory", "topology"] }
mnemosyne-memory-core = { version = "0.2.0", git = "https://github.com/ryancinsight/Mnemosyne.git" }
moirai-gpu = { version = "0.5.0", git = "https://github.com/ryancinsight/Moirai.git", default-features = false, features = [
    "std",
    "parallel",
    "mnemosyne-memory",
] }
moirai-sync = { version = "0.5.0", git = "https://github.com/ryancinsight/Moirai.git" }
moirai = { package = "moirai-runtime", version = "0.5.0", git = "https://github.com/ryancinsight/Moirai.git", default-features = false, features = ["async"] }
# ── Python FFI ──
pyo3 = { version = "0.29.0", features = ["extension-module"] }
numpy = "0.29.0"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Pedantic floor ratchet: every class listed below already fires in this
# workspace and is allowed at its measured baseline; every class NOT listed
# is a hard error. Counts are `cargo clippy --all-targets` hits at the time
# the floor was established (total / production, production excluding
# `#[cfg(test)]` modules and test, bench and example targets). Burn a class
# down to zero, then delete its line -- the floor tightens, never loosens.

# --- Documentation debt (1292 sites, 632 in production) ---
missing_errors_doc = "allow" # 930 (465 prod)
doc_markdown = "allow" # 298 (135 prod)
missing_panics_doc = "allow" # 64 (32 prod)

# --- Raw-pointer / layout debt (760 sites, 374 in production) ---
# hephaestus is the GPU/FFI repo: these are device-pointer and staging-buffer
# casts crossing the driver ABI, not incidental pointer arithmetic.
borrow_as_ptr = "allow" # 510 (255 prod)
ptr_as_ptr = "allow" # 210 (105 prod)
ref_as_ptr = "allow" # 40 (14 prod)

# --- Numeric conversion debt (278 sites, 53 in production) ---
cast_precision_loss = "allow" # 188 (17 prod)
cast_possible_truncation = "allow" # 53 (24 prod)
cast_possible_wrap = "allow" # 20 (9 prod)
cast_sign_loss = "allow" # 13 (3 prod)
unreadable_literal = "allow" # 4 (0 prod)
cast_lossless = "allow" # 3 (0 prod)
float_cmp = "allow" # 2 (1 prod)
comparison_chain = "allow" # 1 (0 prod)
stable_sort_primitive = "allow" # 1 (0 prod)

# --- Style debt (1085 sites, 210 in production) ---
items_after_statements = "allow" # 455 (6 prod)
needless_raw_string_hashes = "allow" # 205 (99 prod)
too_many_lines = "allow" # 84 (29 prod)
needless_pass_by_value = "allow" # 78 (39 prod)
elidable_lifetime_names = "allow" # 62 (31 prod)
similar_names = "allow" # 57 (4 prod)
uninlined_format_args = "allow" # 38 (8 prod)
large_types_passed_by_value = "allow" # 20 (10 prod)
many_single_char_names = "allow" # 18 (8 prod)
trivially_copy_pass_by_ref = "allow" # 12 (6 prod)
manual_assert = "allow" # 11 (0 prod)
unused_self = "allow" # 8 (4 prod)
manual_let_else = "allow" # 8 (1 prod)
semicolon_if_nothing_returned = "allow" # 6 (2 prod)
format_collect = "allow" # 6 (3 prod)
unnecessary_wraps = "allow" # 6 (3 prod)
redundant_closure_for_method_calls = "allow" # 5 (2 prod)
pub_underscore_fields = "allow" # 4 (2 prod)
wildcard_imports = "allow" # 3 (3 prod)
# `use super::*` inside the three `#[cfg(feature = "cuda")]` kernel submodules.
struct_excessive_bools = "allow" # 2 (1 prod)
no_effect_underscore_binding = "allow" # 2 (0 prod)
used_underscore_binding = "allow" # 2 (1 prod)

# --- Restriction floor ---
# `unwrap_used` is denied outright: no workspace-wide allow. Production carries
# ZERO unwraps. The 2022 existing sites (0 in production) all sit in test, bench
# and example targets or `#[cfg(test)]` modules, pinned per file by
# `#![expect(..., reason = "ratchet HEPH-UNWRAP-1")]`, which self-expires the
# moment a file's last unwrap goes.
unwrap_used = "deny"

# `dbg_macro` fires nowhere in the workspace, so it is denied outright.
dbg_macro = "deny"

# `print_stdout` (78 hits) and `print_stderr` (78) are NOT denied. Production is
# already zero for both -- every hit is in a test, bench or example target, or
# in a `#[cfg(test)]` module (the WGPU/CUDA stream tests print an
# adapter-unavailable skip notice). Denying would mean ~70 permanent per-file
# suppressions on targets whose diagnostics are the point. The library-code
# guarantee is the measured zero, re-checked whenever this floor is re-censused.
print_stdout = "allow" # 78 (0 prod)
print_stderr = "allow" # 78 (0 prod)

